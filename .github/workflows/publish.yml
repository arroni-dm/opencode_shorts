name: Tall Tale 3D Auto Pipeline

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '48 4 * * *'
    - cron: '36 9 * * *'
    - cron: '24 14 * * *'
    - cron: '12 19 * * *'
  workflow_dispatch:

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core chromium

      - name: Restore faceless models/cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.faceless-shorts
            ~/.cache/huggingface
          key: faceless-shorts-${{ runner.os }}-v1
          restore-keys: |
            faceless-shorts-${{ runner.os }}-

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Restore run state
        uses: actions/cache@v4
        with:
          path: state
          key: talltale-state-${{ github.run_number }}
          restore-keys: |
            talltale-state-

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PRIVACY_STATUS: private
          CHROME: /usr/bin/chromium
          SOFTWARE_GL: '1'
          FPS: '24'
          QS: '&res=0.6&aa=0&shadow=1024'
        run: python src/main.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talltale-${{ github.run_id }}
          path: output/*.mp4
